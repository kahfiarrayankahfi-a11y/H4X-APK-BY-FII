<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM PANEL</title>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>
    /* RESET & BASE */
    *{ margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
    
    body {
        background: radial-gradient(circle at center, #1a0000, #000000);
        color: white;
        overflow: hidden;
        height: 100vh;
    }

    #particles-js {
        position: fixed; width: 100%; height: 100%; z-index: 0;
    }

    .container {
        position: relative; z-index: 2; height: 100vh;
        display: flex; justify-content: center; align-items: center;
    }

    /* LABEL DEMO */
    .demo-label {
        position: absolute; top: 20px; left: 20px;
        color: rgba(255, 0, 0, 0.5); font-size: 10px;
        letter-spacing: 3px; font-weight: 100; text-transform: uppercase;
    }
